<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">AI Career Dashboard</div>
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('career.career') }}">Career Guide</a>
                <a href="{{ url_for('resume.resume') }}">Resume Analyzer</a>
                <a href="{{ url_for('interview.interview_form') }}">Interview Preparation</a>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('about') }}">About</a>
            </nav>
        </div>
    </header>

    <main class="container dashboard-wrap">
        <section class="panel dashboard-panel">
            <h2>AI Career Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card large">
                    <span>Target Role</span>
                    <strong>Python Developer</strong>
                </div>
                <div class="stat-card large">
                    <span>Career Roadmap</span>
                    <strong>65%</strong>
                </div>
                <div class="stat-card large">
                    <span>Resume Analysis</span>
                    <strong>Completed</strong>
                </div>
                <div class="stat-card large">
                    <span>ATS Estimate</span>
                    <strong>82/100</strong>
                </div>
                <div class="stat-card large">
                    <span>Interview Practice</span>
                    <strong>3 sessions</strong>
                </div>
            </div>

            <div class="progress-list">
                <div class="progress-row"><span>Python</span><strong>✓</strong></div>
                <div class="progress-row"><span>SQL</span><strong>✓</strong></div>
                <div class="progress-row"><span>Flask</span><strong>70%</strong></div>
                <div class="progress-row"><span>Docker</span><strong>30%</strong></div>
            </div>
        </section>
    </main>
</body>
</html>
